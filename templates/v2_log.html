<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulseboard Log</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="/static/v2/palette.css">
    <style>
        :root {
            --sand-0: var(--pb-bg-start);
            --ink-0: var(--pb-ink);
            --surface: var(--pb-surface);
            --border: var(--pb-border);
            --shadow: 0 16px 34px var(--pb-shadow);
            --brand: var(--pb-brand);
            --brand-dark: var(--pb-brand-dark);
            --motion-smooth: cubic-bezier(0.22, 1, 0.36, 1);
        }
        * { box-sizing: border-box; }
        input, select, button { font: inherit; color: inherit; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: "IBM Plex Sans", "Avenir Next", "Segoe UI", sans-serif;
            color: var(--ink-0);
            background:
                radial-gradient(1200px 680px at -10% -12%, color-mix(in srgb, var(--pb-c3) 22%, transparent), transparent 56%),
                radial-gradient(900px 520px at 105% 0%, color-mix(in srgb, var(--pb-c4) 16%, transparent), transparent 52%),
                linear-gradient(180deg, var(--pb-bg-start), var(--pb-bg-mid) 48%, var(--pb-bg-end) 100%);
        }
            .page { max-width: 900px; margin: 0 auto; padding: 14px 14px 94px; }
        .hero, .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(8px);
        }
        :root:not([data-theme="dark"]) .hero,
        :root:not([data-theme="dark"]) .card {
            background: linear-gradient(
                165deg,
                color-mix(in srgb, var(--pb-surface-strong) 92%, white),
                color-mix(in srgb, var(--pb-surface) 94%, var(--pb-c1))
            );
            border-color: color-mix(in srgb, var(--pb-c4) 24%, transparent);
            box-shadow:
                inset 0 1px 0 color-mix(in srgb, white 66%, transparent),
                0 14px 30px color-mix(in srgb, var(--pb-c4) 14%, transparent),
                0 30px 58px color-mix(in srgb, var(--pb-c5) 10%, transparent);
        }
        .hero { padding: 14px; margin-bottom: 12px; position: relative; overflow: hidden; }
        .hero::after {
            content: "";
            position: absolute;
            width: 190px;
            height: 190px;
            right: -48px;
            top: -58px;
            border-radius: 999px;
            background: radial-gradient(circle at center, color-mix(in srgb, var(--pb-c3) 24%, transparent), transparent 70%);
            pointer-events: none;
        }
        .hero-top {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            flex-wrap: wrap;
        }
        .hero-actions {
            display: inline-flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        .theme-toggle {
            position: absolute;
            top: 10px;
            right: 10px;
            border-radius: 999px;
            height: 28px;
            padding: 0 10px;
            border: 1px solid color-mix(in srgb, var(--pb-c4) 30%, transparent);
            background: color-mix(in srgb, var(--pb-surface) 76%, transparent);
            color: var(--pb-link);
            font-weight: 700;
            font-size: 0.78rem;
            cursor: pointer;
            z-index: 2;
        }
        :root:not([data-theme="dark"]) .theme-toggle {
            background: linear-gradient(
                145deg,
                color-mix(in srgb, var(--pb-surface-strong) 86%, white),
                color-mix(in srgb, var(--pb-surface) 90%, var(--pb-c1))
            );
            border-color: color-mix(in srgb, var(--pb-c4) 24%, transparent);
        }
        h1 {
            margin: 0;
            font-family: "Sora", sans-serif;
            font-size: clamp(1.25rem, 3.2vw, 1.9rem);
            letter-spacing: -0.012em;
            font-weight: 780;
            color: var(--pb-heading);
        }
        .nav-links a {
            display: inline-block;
            margin-left: 6px;
            text-decoration: none;
            border-radius: 999px;
            padding: 6px 11px;
            border: 1px solid color-mix(in srgb, var(--pb-c4) 30%, transparent);
            font-weight: 700;
            color: var(--pb-link);
            background: var(--pb-surface-strong);
            transition: transform 220ms var(--motion-smooth), box-shadow 240ms var(--motion-smooth), background 220ms var(--motion-smooth), border-color 220ms var(--motion-smooth);
        }
        .nav-links a.active {
            background: linear-gradient(
                135deg,
                color-mix(in srgb, var(--pb-brand) 68%, var(--pb-surface-strong)),
                color-mix(in srgb, var(--pb-brand-dark) 74%, var(--pb-surface))
            );
            color: var(--pb-on-brand);
            border-color: color-mix(in srgb, var(--pb-brand-dark) 42%, transparent);
            box-shadow: 0 8px 16px color-mix(in srgb, var(--pb-brand-dark) 20%, transparent);
        }
        .status { margin-top: 8px; font-size: 0.82rem; color: var(--pb-ink-muted); }
        .hero-copy {
            margin: 8px 0 0;
            max-width: 60ch;
            font-size: 0.88rem;
            color: var(--pb-ink-muted);
        }
        .stack { display: grid; grid-template-columns: 1fr; gap: 12px; }
        .card { padding: 12px; }
        .card h2 {
            margin: 0 0 10px;
            font-family: "Sora", sans-serif;
            font-size: 1rem;
            letter-spacing: 0.008em;
            font-weight: 720;
            color: var(--pb-heading);
        }
        .logger-flow {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
            align-items: end;
        }
        .field-label {
            margin-bottom: 6px;
            display: block;
            font-size: 0.76rem;
            letter-spacing: 0.35px;
            text-transform: uppercase;
            color: var(--pb-ink-muted);
            font-weight: 700;
        }
        .logger-kind { display: grid; }
        .logger-flow select,
        .inline-form input,
        .inline-form select,
        .inline-form button,
        .dialog-form input,
        .dialog-form select,
        .dialog-form button {
            border-radius: 999px;
            border: 1px solid color-mix(in srgb, var(--pb-c4) 28%, transparent);
            height: 36px;
            padding: 0 12px;
            background: var(--pb-surface-strong);
            outline: none;
            color: var(--pb-ink-soft);
        }
        .inline-form button,
        .dialog-form button {
            border: 1px solid color-mix(in srgb, var(--brand-dark) 42%, transparent);
            background: linear-gradient(
                135deg,
                color-mix(in srgb, var(--brand) 68%, var(--pb-surface-strong)),
                color-mix(in srgb, var(--brand-dark) 76%, var(--pb-surface))
            );
            color: var(--pb-on-brand);
            font-weight: 700;
            cursor: pointer;
        }
        .inline-form button {
            box-shadow: 0 10px 20px color-mix(in srgb, var(--pb-c4) 28%, transparent);
            transition: transform 220ms var(--motion-smooth), box-shadow 240ms var(--motion-smooth);
        }
        .inline-form button:hover {
            transform: translateY(-1px);
            box-shadow: 0 14px 22px color-mix(in srgb, var(--pb-c4) 32%, transparent);
        }
        .composer-card {
            padding: 12px;
        }
        .composer-step {
            margin: 0 0 10px;
            color: var(--pb-ink-muted);
            font-size: 0.82rem;
        }
        .inline-form {
            display: grid;
            gap: 8px;
        }
        .log-preview {
            margin-top: 10px;
            font-size: 0.84rem;
            color: var(--pb-ink-soft);
            border: 1px solid color-mix(in srgb, var(--pb-c4) 22%, transparent);
            border-radius: 10px;
            padding: 8px 10px;
        }
        .workout-types {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
        }
        .type-chip {
            display: flex;
            align-items: center;
            gap: 6px;
            border-radius: 10px;
            border: 1px solid color-mix(in srgb, var(--pb-c4) 14%, transparent);
            background: var(--pb-surface-strong);
            padding: 8px 10px;
            font-size: 0.82rem;
            color: var(--pb-ink-soft);
            cursor: pointer;
            min-height: 52px;
            transition: border-color 200ms var(--motion-smooth), box-shadow 220ms var(--motion-smooth), background 220ms var(--motion-smooth);
        }
        .type-chip:hover {
            border-color: color-mix(in srgb, var(--pb-brand-dark) 34%, transparent);
            box-shadow: 0 8px 16px color-mix(in srgb, var(--pb-c5) 8%, transparent);
        }
        .type-chip input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            width: 28px;
            height: 28px;
            border-radius: 999px;
            border: 1.5px solid color-mix(in srgb, var(--pb-c4) 36%, transparent);
            background: color-mix(in srgb, var(--pb-surface-strong) 86%, var(--pb-surface));
            display: inline-grid;
            place-items: center;
            margin: 0 8px 0 2px;
            transition: border-color 180ms var(--motion-smooth), background 200ms var(--motion-smooth), box-shadow 200ms var(--motion-smooth);
            flex: 0 0 auto;
        }
        .type-chip input[type="checkbox"]::after {
            content: "";
            width: 10px;
            height: 10px;
            border-radius: 999px;
            background: transparent;
            transform: scale(0.5);
            transition: transform 180ms var(--motion-smooth), background 180ms var(--motion-smooth);
        }
        .type-chip input[type="checkbox"]:checked {
            border-color: color-mix(in srgb, var(--pb-brand-dark) 50%, transparent);
            background: linear-gradient(
                135deg,
                color-mix(in srgb, var(--pb-brand) 66%, var(--pb-surface-strong)),
                color-mix(in srgb, var(--pb-brand-dark) 78%, var(--pb-surface))
            );
            box-shadow: 0 4px 10px color-mix(in srgb, var(--pb-brand-dark) 22%, transparent);
        }
        .type-chip input[type="checkbox"]:checked::after {
            background: var(--pb-on-brand);
            transform: scale(1);
        }
        .type-chip input[type="checkbox"]:focus-visible {
            outline: 2px solid color-mix(in srgb, var(--pb-focus) 56%, transparent);
            outline-offset: 2px;
        }
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 0.84rem; }
        th, td {
            border-bottom: 1px solid color-mix(in srgb, var(--pb-c4) 14%, transparent);
            padding: 7px 5px;
            text-align: left;
            white-space: nowrap;
        }
        th {
            color: var(--pb-ink-soft);
            text-transform: uppercase;
            letter-spacing: 0.4px;
            font-size: 0.72rem;
        }
        .history-title {
            margin: 0 0 8px;
            font-family: "Sora", sans-serif;
            font-size: 0.9rem;
            color: var(--pb-heading);
        }
        .history-subtitle {
            margin: 0 0 10px;
            color: var(--pb-ink-muted);
            font-size: 0.83rem;
        }
        .history-actions { display: inline-flex; gap: 6px; }
        .action-btn {
            border: 1px solid color-mix(in srgb, var(--pb-focus) 28%, transparent);
            border-radius: 999px;
            background: var(--pb-surface-strong);
            color: var(--pb-focus);
            height: 28px;
            padding: 0 10px;
            font-size: 0.74rem;
            font-weight: 700;
            transition: transform 220ms var(--motion-smooth), box-shadow 240ms var(--motion-smooth), border-color 220ms var(--motion-smooth);
        }
        .action-btn[data-action="delete"] {
            border-color: color-mix(in srgb, var(--pb-danger) 34%, transparent);
            color: var(--pb-danger);
        }
        dialog {
            border: 1px solid color-mix(in srgb, var(--pb-c4) 24%, transparent);
            border-radius: 16px;
            padding: 0;
            box-shadow: var(--shadow);
            width: min(560px, calc(100vw - 30px));
            background: var(--pb-surface);
            color: var(--pb-ink);
        }
        :root:not([data-theme="dark"]) dialog {
            background: linear-gradient(
                160deg,
                color-mix(in srgb, var(--pb-surface-strong) 94%, white),
                color-mix(in srgb, var(--pb-surface) 95%, var(--pb-c1))
            );
            border-color: color-mix(in srgb, var(--pb-c4) 22%, transparent);
        }
        dialog::backdrop { background: color-mix(in srgb, var(--pb-c5) 34%, transparent); }
        .dialog-body {
            padding: 14px;
            border-radius: 16px;
            background: transparent;
        }
        .dialog-body h2 {
            margin: 2px 0 4px;
            font-family: "Sora", sans-serif;
            font-size: 1rem;
            color: var(--pb-heading);
        }
        .dialog-step {
            margin: 0 0 10px;
            font-size: 0.79rem;
            color: var(--pb-ink-muted);
        }
        .dialog-form { display: grid; gap: 8px; }
        .dialog-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 2px; }
        .ghost-btn {
            border-radius: 999px;
            border: 1px solid color-mix(in srgb, var(--pb-c4) 25%, transparent);
            background: var(--pb-surface-strong);
            height: 36px;
            padding: 0 12px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 220ms var(--motion-smooth), box-shadow 240ms var(--motion-smooth), border-color 220ms var(--motion-smooth);
        }
        .theme-toggle {
            transition: transform 220ms var(--motion-smooth), box-shadow 240ms var(--motion-smooth), border-color 220ms var(--motion-smooth);
        }
        .theme-toggle:hover,
        .nav-links a:hover,
        .action-btn:hover,
        .ghost-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 18px color-mix(in srgb, var(--pb-c5) 10%, transparent);
        }
        .theme-toggle:focus-visible,
        .nav-links a:focus-visible,
        .action-btn:focus-visible,
        .ghost-btn:focus-visible,
        .inline-form button:focus-visible,
        .dialog-form button:focus-visible {
            outline: 2px solid color-mix(in srgb, var(--pb-focus) 58%, transparent);
            outline-offset: 2px;
        }
        .bottom-nav {
            position: fixed;
            left: 50%;
            transform: translateX(-50%);
            bottom: calc(12px + env(safe-area-inset-bottom));
            padding: 7px;
            border-radius: 999px;
            backdrop-filter: blur(14px) saturate(1.15);
            background: color-mix(in srgb, var(--pb-surface) 70%, transparent);
            border: 1px solid color-mix(in srgb, var(--pb-c4) 22%, transparent);
            box-shadow:
                inset 0 1px 0 color-mix(in srgb, white 40%, transparent),
                0 14px 28px color-mix(in srgb, var(--pb-c5) 16%, transparent);
            z-index: 40;
        }
        .bottom-nav-inner {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            white-space: nowrap;
        }
        .bottom-tab {
            border-radius: 999px;
            min-height: 36px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.86rem;
            padding: 0 14px;
            color: var(--pb-link);
            border: 1px solid color-mix(in srgb, var(--pb-c4) 26%, transparent);
            background: var(--pb-surface-strong);
        }
        .bottom-tab.active {
            color: var(--pb-on-brand);
            border-color: color-mix(in srgb, var(--pb-brand-dark) 42%, transparent);
            background: linear-gradient(
                135deg,
                color-mix(in srgb, var(--pb-brand) 68%, var(--pb-surface-strong)),
                color-mix(in srgb, var(--pb-brand-dark) 74%, var(--pb-surface))
            );
        }
        @media (max-width: 640px) {
            .inline-form button { width: 100%; }
            .bottom-tab {
                min-height: 34px;
                padding: 0 12px;
                font-size: 0.82rem;
            }
        }
    </style>
</head>
<body>
    <main class="page">
        <section class="hero">
            <div class="hero-top">
                <h1>📝 Log</h1>
                <div class="hero-actions">
                    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle dark mode">🌙 Dark</button>
                </div>
            </div>
            <p class="hero-copy">Pick one log type, complete the focused form, and review only the recent entries that matter for that flow.</p>
            <div id="status" class="status">Ready.</div>
        </section>

        <section class="stack">
            <article class="card">
                <h2>Log Something</h2>
                <div class="logger-flow">
                    <div class="logger-kind">
                        <label for="log-kind" class="field-label">Select Entry Type</label>
                        <select id="log-kind">
                            <option value="weigh">⚖️ Weigh-in</option>
                            <option value="injection">💉 Injection</option>
                            <option value="workout">💪 Workout</option>
                        </select>
                    </div>
                </div>
                <div id="log-preview" class="log-preview">You are about to log a weigh-in.</div>
            </article>

            <article id="composer-card" class="card composer-card">
                <h2 id="composer-title">⚖️ Log Weigh-In</h2>
                <p class="composer-step">Step 2 of 2</p>
                <form id="inline-form" class="inline-form"></form>
            </article>

            <article class="card">
                <h2 id="history-title">Recent Weigh-Ins</h2>
                <p id="history-subtitle" class="history-subtitle">Showing your latest weigh-ins first.</p>
                <div id="history-active" class="table-wrap"></div>
            </article>
        </section>
    </main>

    <dialog id="log-dialog">
        <div class="dialog-body">
            <h2 id="dialog-title">Log Entry</h2>
            <p id="dialog-step" class="dialog-step">Step 2 of 2</p>
            <form id="dialog-form" class="dialog-form"></form>
            <div class="dialog-actions">
                <button id="dialog-cancel" type="button" class="ghost-btn">Cancel</button>
            </div>
        </div>
    </dialog>

    <nav class="bottom-nav" aria-label="Primary">
        <div class="bottom-nav-inner">
            <a class="bottom-tab active" href="/">📝 Log</a>
            <a class="bottom-tab" href="/insights">📊 Insights</a>
        </div>
    </nav>

    <script type="module" src="/static/v2/log.js"></script>
</body>
</html>
