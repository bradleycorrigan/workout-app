<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulseboard Log</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --sand-0: #f7f2e6;
            --ink-0: #1a2f2b;
            --surface: rgba(255, 255, 255, 0.66);
            --border: rgba(44, 72, 66, 0.16);
            --shadow: 0 16px 34px rgba(26, 47, 43, 0.12);
            --brand: #1f7a68;
            --brand-dark: #15574a;
            --brand-wash: rgba(31, 122, 104, 0.12);
        }
        * { box-sizing: border-box; }
        input, select, button { font: inherit; color: inherit; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: "IBM Plex Sans", "Avenir Next", "Segoe UI", sans-serif;
            color: var(--ink-0);
            background:
                radial-gradient(1200px 680px at -10% -12%, rgba(31, 122, 104, 0.22), transparent 56%),
                radial-gradient(900px 520px at 105% 0%, rgba(36, 80, 165, 0.16), transparent 52%),
                linear-gradient(180deg, var(--sand-0), #efe8d8 48%, #e8e0cf 100%);
        }
        .page { max-width: 900px; margin: 0 auto; padding: 14px; }
        .hero, .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(8px);
        }
        .hero { padding: 14px; margin-bottom: 12px; position: relative; overflow: hidden; }
        .hero::after {
            content: "";
            position: absolute;
            width: 190px;
            height: 190px;
            right: -48px;
            top: -58px;
            border-radius: 999px;
            background: radial-gradient(circle at center, rgba(31, 122, 104, 0.22), transparent 70%);
            pointer-events: none;
        }
        .hero-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        h1 {
            margin: 0;
            font-family: "Sora", sans-serif;
            font-size: clamp(1.25rem, 3.2vw, 1.9rem);
            color: #123730;
        }
        .nav-links a {
            display: inline-block;
            margin-left: 6px;
            text-decoration: none;
            border-radius: 999px;
            padding: 7px 12px;
            border: 1px solid rgba(31, 122, 104, 0.3);
            font-weight: 700;
            color: #1f6657;
            background: rgba(255, 255, 255, 0.74);
        }
        .nav-links a.active {
            background: linear-gradient(135deg, #1f7a68, #15574a);
            color: #f4fffb;
            border-color: transparent;
        }
        .status { margin-top: 8px; font-size: 0.82rem; color: #375d54; }
        .hero-copy {
            margin: 8px 0 0;
            max-width: 60ch;
            font-size: 0.88rem;
            color: #30554d;
        }
        .stack { display: grid; grid-template-columns: 1fr; gap: 12px; }
        .card { padding: 12px; }
        .card h2 {
            margin: 0 0 10px;
            font-family: "Sora", sans-serif;
            font-size: 1rem;
            color: #173b33;
        }
        .logger-flow {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 8px;
            align-items: end;
        }
        .field-label {
            margin-bottom: 6px;
            display: block;
            font-size: 0.76rem;
            letter-spacing: 0.35px;
            text-transform: uppercase;
            color: #355e55;
            font-weight: 700;
        }
        .logger-kind {
            display: grid;
        }
        .logger-flow select,
        .logger-flow button,
        .dialog-form input,
        .dialog-form select,
        .dialog-form button {
            border-radius: 999px;
            border: 1px solid rgba(26, 47, 43, 0.2);
            height: 40px;
            padding: 0 12px;
            background: rgba(255, 255, 255, 0.9);
            outline: none;
        }
        .logger-flow button,
        .dialog-form button {
            border: none;
            background: linear-gradient(135deg, var(--brand), var(--brand-dark));
            color: #f4fffb;
            font-weight: 700;
            cursor: pointer;
        }
        .logger-flow button {
            box-shadow: 0 10px 20px rgba(21, 87, 74, 0.25);
            transition: transform 160ms ease, box-shadow 160ms ease;
        }
        .logger-flow button:hover {
            transform: translateY(-1px);
            box-shadow: 0 14px 22px rgba(21, 87, 74, 0.28);
        }
        .log-preview {
            margin-top: 10px;
            font-size: 0.84rem;
            color: #2a5149;
            background: var(--brand-wash);
            border: 1px solid rgba(31, 122, 104, 0.2);
            border-radius: 10px;
            padding: 8px 10px;
        }
        .workout-types {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
        }
        .type-chip {
            display: flex;
            align-items: center;
            gap: 6px;
            border-radius: 10px;
            border: 1px solid rgba(44, 72, 66, 0.2);
            background: rgba(255, 255, 255, 0.84);
            padding: 8px 10px;
            font-size: 0.82rem;
            color: #21463f;
        }
        .type-chip input[type="checkbox"] { accent-color: #1f7a68; }
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 0.84rem; }
        th, td {
            border-bottom: 1px solid rgba(36, 80, 165, 0.14);
            padding: 7px 5px;
            text-align: left;
            white-space: nowrap;
        }
        th {
            color: #2e554e;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            font-size: 0.72rem;
        }
        .history-title {
            margin: 0 0 8px;
            font-family: "Sora", sans-serif;
            font-size: 0.9rem;
            color: #173b33;
        }
        .history-subtitle {
            margin: 0 0 10px;
            color: #3a6058;
            font-size: 0.83rem;
        }
        .history-actions { display: inline-flex; gap: 6px; }
        .action-btn {
            border: 1px solid rgba(36, 80, 165, 0.25);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.8);
            color: #204c92;
            height: 28px;
            padding: 0 10px;
            font-size: 0.74rem;
            font-weight: 700;
            cursor: pointer;
        }
        .action-btn[data-action="delete"] {
            border-color: rgba(154, 33, 43, 0.28);
            color: #8a1f2c;
        }
        dialog {
            border: 1px solid rgba(44, 72, 66, 0.2);
            border-radius: 16px;
            padding: 0;
            box-shadow: var(--shadow);
            width: min(560px, calc(100vw - 30px));
        }
        dialog::backdrop { background: rgba(0, 26, 24, 0.34); }
        .dialog-body { padding: 14px; }
        .dialog-body h2 {
            margin: 2px 0 4px;
            font-family: "Sora", sans-serif;
            font-size: 1rem;
            color: #173b33;
        }
        .dialog-step {
            margin: 0 0 10px;
            font-size: 0.79rem;
            color: #3e645c;
        }
        .dialog-form { display: grid; gap: 8px; }
        .dialog-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 2px; }
        .ghost-btn {
            border-radius: 999px;
            border: 1px solid rgba(44, 72, 66, 0.25);
            background: rgba(255, 255, 255, 0.9);
            height: 36px;
            padding: 0 12px;
            font-weight: 700;
            cursor: pointer;
        }
        @media (max-width: 640px) {
            .logger-flow {
                grid-template-columns: 1fr;
            }
            .logger-flow button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <main class="page">
        <section class="hero">
            <div class="hero-top">
                <h1>📝 Log</h1>
                <div class="nav-links">
                    <a href="/" class="active">📝 Log</a>
                    <a href="/insights">📊 Insights</a>
                </div>
            </div>
            <p class="hero-copy">Pick one log type, complete the focused form, and review only the recent entries that matter for that flow.</p>
            <div id="status" class="status">Ready.</div>
        </section>

        <section class="stack">
            <article class="card">
                <h2>Log Something</h2>
                <div class="logger-flow">
                    <div class="logger-kind">
                        <label for="log-kind" class="field-label">Select Entry Type</label>
                        <select id="log-kind">
                            <option value="weigh">⚖️ Weigh-in</option>
                            <option value="injection">💉 Injection</option>
                            <option value="workout">💪 Workout</option>
                        </select>
                    </div>
                    <button id="log-next">Next</button>
                </div>
                <div id="log-preview" class="log-preview">You are about to log a weigh-in.</div>
            </article>

            <article class="card">
                <h2 id="history-title">Recent Weigh-Ins</h2>
                <p id="history-subtitle" class="history-subtitle">Showing your latest weigh-ins first.</p>
                <div id="history-active" class="table-wrap"></div>
            </article>
        </section>
    </main>

    <dialog id="log-dialog">
        <div class="dialog-body">
            <h2 id="dialog-title">Log Entry</h2>
            <p id="dialog-step" class="dialog-step">Step 2 of 2</p>
            <form id="dialog-form" class="dialog-form"></form>
            <div class="dialog-actions">
                <button id="dialog-cancel" type="button" class="ghost-btn">Cancel</button>
            </div>
        </div>
    </dialog>

    <script type="module" src="/static/v2/log.js"></script>
</body>
</html>
