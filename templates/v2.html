<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulseboard Insights</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <style>
        :root {
            --sand-0: #f7f2e6;
            --ink-0: #1a2f2b;
            --surface: rgba(255, 255, 255, 0.66);
            --border: rgba(44, 72, 66, 0.16);
            --shadow: 0 16px 34px rgba(26, 47, 43, 0.12);
        }
        * { box-sizing: border-box; }
        input, button { font: inherit; color: inherit; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: "IBM Plex Sans", "Avenir Next", "Segoe UI", sans-serif;
            color: var(--ink-0);
            background:
                radial-gradient(1200px 680px at -10% -12%, rgba(31, 122, 104, 0.22), transparent 56%),
                radial-gradient(900px 520px at 105% 0%, rgba(36, 80, 165, 0.16), transparent 52%),
                linear-gradient(180deg, var(--sand-0), #efe8d8 48%, #e8e0cf 100%);
        }
        .page { max-width: 900px; margin: 0 auto; padding: 14px; }
        .hero, .card, .metric-tile {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(8px);
        }
        .hero { padding: 14px; margin-bottom: 12px; }
        .hero-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        h1 {
            margin: 0;
            font-family: "Sora", sans-serif;
            font-size: clamp(1.25rem, 3.2vw, 1.9rem);
            color: #123730;
        }
        .nav-links a {
            display: inline-block;
            margin-left: 6px;
            text-decoration: none;
            border-radius: 999px;
            padding: 7px 12px;
            border: 1px solid rgba(31, 122, 104, 0.3);
            font-weight: 700;
            color: #1f6657;
            background: rgba(255, 255, 255, 0.74);
        }
        .nav-links a.active {
            background: linear-gradient(135deg, #1f7a68, #15574a);
            color: #f4fffb;
            border-color: transparent;
        }
        .filters {
            margin-top: 10px;
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 8px;
        }
        .filters input, .filters button {
            border-radius: 999px;
            border: 1px solid rgba(26, 47, 43, 0.2);
            height: 38px;
            padding: 0 12px;
            background: rgba(255, 255, 255, 0.86);
        }
        .filters button {
            border: none;
            background: linear-gradient(135deg, #1f7a68, #15574a);
            color: #f4fffb;
            font-weight: 700;
            cursor: pointer;
        }
        .status { margin-top: 8px; font-size: 0.82rem; color: #375d54; }
        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            margin-top: 12px;
        }
        .metric-tile { padding: 12px; }
        .metric-label {
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #41645c;
            font-weight: 700;
        }
        .metric-value {
            margin-top: 4px;
            font-size: 2rem;
            font-family: "Sora", sans-serif;
            color: #1f5f4e;
            line-height: 1;
        }
        .stack { display: grid; grid-template-columns: 1fr; gap: 12px; margin-top: 12px; }
        .card { padding: 12px; }
        .card h2 {
            margin: 0 0 10px;
            font-family: "Sora", sans-serif;
            font-size: 1rem;
            color: #173b33;
        }
        .chart { width: 100%; min-height: 260px; }
        .chart.short { min-height: 210px; }
        .legend { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
        .legend-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border-radius: 999px;
            padding: 4px 8px;
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(44, 72, 66, 0.18);
            font-size: 0.76rem;
            color: #284a43;
        }
        .dot { width: 10px; height: 10px; border-radius: 50%; }
        .heatmap-legend {
            margin-top: 8px;
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 10px;
            align-items: center;
        }
        .heatmap-ramp {
            height: 10px;
            border-radius: 999px;
            background: linear-gradient(90deg, #edf6f2, #c4e7da, #80c9b1, #2e8f72);
            border: 1px solid rgba(44, 72, 66, 0.2);
        }
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 0.84rem; }
        th, td {
            border-bottom: 1px solid rgba(36, 80, 165, 0.14);
            padding: 7px 5px;
            text-align: left;
            white-space: nowrap;
        }
        th {
            color: #2e554e;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            font-size: 0.72rem;
        }
        @media (max-width: 720px) {
            .filters { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <main class="page">
        <section class="hero">
            <div class="hero-top">
                <h1>📊 Insights</h1>
                <div class="nav-links">
                    <a href="/">📝 Log</a>
                    <a href="/insights" class="active">📊 Insights</a>
                </div>
            </div>
            <div class="filters">
                <input id="start-date" type="date" aria-label="Start date">
                <input id="end-date" type="date" aria-label="End date">
                <button id="apply">Apply Dates</button>
            </div>
            <div id="status" class="status">Loading charts...</div>
        </section>

        <section class="metrics-grid">
            <article class="metric-tile">
                <div id="metric-workouts-label" class="metric-label">💪 Workouts</div>
                <div id="metric-workouts" class="metric-value">0</div>
            </article>
            <article class="metric-tile">
                <div id="metric-weigh-label" class="metric-label">⚖️ Weigh-ins</div>
                <div id="metric-weigh" class="metric-value">0</div>
            </article>
            <article class="metric-tile">
                <div id="metric-value-label" class="metric-label">💷 Workout Value GBP</div>
                <div id="metric-value" class="metric-value">0.00</div>
            </article>
        </section>

        <section class="stack">
            <article class="card">
                <h2>Estimated Concentration</h2>
                <div id="conc-chart" class="chart"></div>
            </article>

            <article class="card">
                <h2>Weight Trend</h2>
                <div id="weight-chart" class="chart"></div>
            </article>

            <article class="card">
                <h2>Workout Mix</h2>
                <div id="mix-chart" class="chart"></div>
                <div class="legend">
                    <span class="legend-chip"><span class="dot" style="background:#7db4d8"></span>Gym</span>
                    <span class="legend-chip"><span class="dot" style="background:#4f8dff"></span>Pool Swim</span>
                    <span class="legend-chip"><span class="dot" style="background:#4d9c76"></span>Lido/Res Swim</span>
                </div>
            </article>

            <article class="card">
                <h2>Workout Day Heatmap</h2>
                <div id="heatmap-chart" class="chart short"></div>
                <div class="heatmap-legend">
                    <div class="heatmap-ramp"></div>
                    <span class="legend-chip">Lower to higher activity</span>
                </div>
            </article>

            <article class="card">
                <h2>Monthly Summary</h2>
                <div id="summary-table" class="table-wrap"></div>
            </article>
        </section>
    </main>
    <script type="module" src="/static/v2/insights.js"></script>
</body>
</html>
